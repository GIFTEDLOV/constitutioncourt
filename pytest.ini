[pytest]
testpaths = tests
markers =
    integration: hits a live GenLayer network; slow, opt-in, never run in CI

# Integration tests are excluded by default so `pytest` stays fast and offline.
# Stage 1 ships no integration suite at all; the marker is registered now so
# that adding one later cannot introduce an unregistered-marker warning.
#
#     pytest tests/direct                    # default, offline, fast
#     pytest tests/integration -m integration  # opt-in, requires funded account
addopts = -m "not integration" --strict-markers
