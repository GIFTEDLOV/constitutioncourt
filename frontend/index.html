<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Tab icon. All four assets are served from this origin, so the existing
      CSP (`img-src 'self' data: blob:`) covers them unchanged and no CDN is
      involved. The SVG is preferred where supported; the PNGs are the fallback
      for browsers that do not take an SVG favicon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#04211d" />

    <title>ConstitutionCourt — governance-compliance adjudication</title>
    <meta
      name="description"
      content="A challenger pins a constitution, proposal, vote record and notice record. GenLayer validators independently re-fetch the evidence and determine whether the proposal complied with the pinned constitution."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
